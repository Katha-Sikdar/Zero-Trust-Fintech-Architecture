# API gateway (PEP-1). Fronts the mesh: TLS termination and request-rate
# limiting — the denial-of-service control for OWASP API4. The limit zone is
# the gateway-layer actuator that the RQ3 predictive model tunes; S6 raises it
# to the model-derived value near lambda*.
worker_processes auto;
events { worker_connections 4096; }
http {
    # rate = requests/sec/key; burst absorbs short spikes. RATE is templated per
    # scenario by scripts/render-gateway.sh (default 200 r/s).
    limit_req_zone $binary_remote_addr zone=api:10m rate=200r/s;
    limit_req_status 429;

    upstream mesh {
        server envoy:8000;
        keepalive 128;
    }
    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate     /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;

        listen 8081;  # plaintext for local benchmarking without TLS overhead

        location /health { proxy_pass http://mesh; }
        location / {
            limit_req zone=api burst=400 nodelay;
            proxy_pass http://mesh;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }
    }
}
