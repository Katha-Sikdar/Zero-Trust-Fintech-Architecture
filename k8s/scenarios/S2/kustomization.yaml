apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: zta
resources:
  - ../../base
  - ../../istio/peer-authentication.yaml
configMapGenerator:
  - name: app-config
    behavior: merge
    literals: [JWT_MODE=none, AUTH_MODE=none, SCENARIO=S2]
generatorOptions: { disableNameSuffixHash: true }
