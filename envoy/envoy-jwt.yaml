# Standalone Envoy sidecar (Docker Compose testbed) — Scenario S4.
# Terminates client traffic, validates the JWT locally against jwks.json, injects
# the verified payload as x-jwt-payload, and proxies to the Node.js app. No
# object-level authz here (that is S5). This isolates the cost of moving JWT
# validation off the Node.js event loop (RQ1).
admin:
  address: { socket_address: { address: 0.0.0.0, port_value: 9901 } }
static_resources:
  listeners:
  - name: ingress
    address: { socket_address: { address: 0.0.0.0, port_value: 8000 } }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          route_config:
            name: local
            virtual_hosts:
            - name: app
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: app, timeout: 30s }
          http_filters:
          - name: envoy.filters.http.jwt_authn
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
              providers:
                local:
                  issuer: zta-testbed
                  audiences: []
                  forward: true
                  forward_payload_header: x-jwt-payload
                  payload_in_metadata: jwt_payload
                  local_jwks: { filename: /etc/envoy/jwks.json }
              rules:
              - match: { prefix: "/health" }
              - match: { prefix: "/metrics" }
              - match: { prefix: "/" }
                requires: { provider_name: local }
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: app
    type: STRICT_DNS
    connect_timeout: 1s
    load_assignment:
      cluster_name: app
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address: { address: app, port_value: 8080 } } }
    # Connection-pool ceiling: this is what saturates first past lambda*, which is
    # exactly the A10 fail-open condition under study.
    circuit_breakers:
      thresholds:
      - priority: DEFAULT
        max_connections: 256
        max_pending_requests: 256
        max_requests: 256
